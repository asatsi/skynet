version: '3.9'

services:

  # ── Spring Boot Microservices ────────────────────────────────────────────────
  customer-service:
    build: ./services/customer-service
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/api/v1/customers > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  kyc-service:
    build: ./services/kyc-service
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/v1/kyc > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  document-service:
    build: ./services/document-service
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/api/v1/documents > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  risk-service:
    build: ./services/risk-service
    ports: ["8084:8084"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/api/v1/risk > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  workflow-service:
    build: ./services/workflow-service
    ports: ["8085:8085"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/api/v1/workflows > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  loan-service:
    build: ./services/loan-service
    ports: ["8086:8086"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/api/v1/loans > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── MCP Domain Servers ───────────────────────────────────────────────────────
  customer-mcp:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r mcp-servers/requirements.txt &&
             python3 mcp-servers/customer_mcp_server.py"
    ports: ["9001:9001"]
    environment:
      - CUSTOMER_SERVICE_URL=http://customer-service:8081
    depends_on:
      customer-service:
        condition: service_healthy

  kyc-mcp:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r mcp-servers/requirements.txt &&
             python3 mcp-servers/kyc_mcp_server.py"
    ports: ["9002:9002"]
    environment:
      - KYC_SERVICE_URL=http://kyc-service:8082
    depends_on:
      kyc-service:
        condition: service_healthy

  document-mcp:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r mcp-servers/requirements.txt &&
             python3 mcp-servers/document_mcp_server.py"
    ports: ["9003:9003"]
    environment:
      - DOCUMENT_SERVICE_URL=http://document-service:8083
    depends_on:
      document-service:
        condition: service_healthy

  risk-mcp:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r mcp-servers/requirements.txt &&
             python3 mcp-servers/risk_mcp_server.py"
    ports: ["9004:9004"]
    environment:
      - RISK_SERVICE_URL=http://risk-service:8084
    depends_on:
      risk-service:
        condition: service_healthy

  workflow-mcp:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r mcp-servers/requirements.txt &&
             python3 mcp-servers/workflow_mcp_server.py"
    ports: ["9005:9005"]
    environment:
      - WORKFLOW_SERVICE_URL=http://workflow-service:8085
    depends_on:
      workflow-service:
        condition: service_healthy

  knowledge-mcp:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r mcp-servers/requirements.txt &&
             python3 mcp-servers/knowledge_mcp_server.py"
    ports: ["9006:9006"]

  loan-mcp:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r mcp-servers/requirements.txt &&
             python3 mcp-servers/loan_mcp_server.py"
    ports: ["9007:9007"]
    environment:
      - LOAN_SERVICE_URL=http://loan-service:8086
    depends_on:
      loan-service:
        condition: service_healthy

  # ── MCP Gateway ──────────────────────────────────────────────────────────────
  mcp-gateway:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r mcp-servers/requirements.txt &&
             python3 mcp-servers/gateway_server.py"
    ports: ["9000:9000"]
    environment:
      - MCP_CUSTOMER_URL=http://customer-mcp:9001
      - MCP_KYC_URL=http://kyc-mcp:9002
      - MCP_DOCUMENT_URL=http://document-mcp:9003
      - MCP_RISK_URL=http://risk-mcp:9004
      - MCP_WORKFLOW_URL=http://workflow-mcp:9005
      - MCP_KNOWLEDGE_URL=http://knowledge-mcp:9006
      - MCP_LOAN_URL=http://loan-mcp:9007
    depends_on:
      - customer-mcp
      - kyc-mcp
      - document-mcp
      - risk-mcp
      - workflow-mcp
      - knowledge-mcp
      - loan-mcp

  # ── Agent Server + UI ────────────────────────────────────────────────────────
  agent-server:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: >
      sh -c "pip install -q -r agents/requirements.txt &&
             python3 agents/server.py"
    ports: ["8096:8096"]
    environment:
      # ── Spring Boot service URLs (Docker service names) ──────────────────
      - CUSTOMER_SERVICE_URL=http://customer-service:8081
      - KYC_SERVICE_URL=http://kyc-service:8082
      - DOCUMENT_SERVICE_URL=http://document-service:8083
      - RISK_SERVICE_URL=http://risk-service:8084
      - WORKFLOW_SERVICE_URL=http://workflow-service:8085
      - LOAN_SERVICE_URL=http://loan-service:8086
      # ── MCP server URLs (Docker service names) ───────────────────────────
      - MCP_CUSTOMER_URL=http://customer-mcp:9001
      - MCP_KYC_URL=http://kyc-mcp:9002
      - MCP_DOCUMENT_URL=http://document-mcp:9003
      - MCP_RISK_URL=http://risk-mcp:9004
      - MCP_WORKFLOW_URL=http://workflow-mcp:9005
      - MCP_KNOWLEDGE_URL=http://knowledge-mcp:9006
      - MCP_LOAN_URL=http://loan-mcp:9007
      - MCP_GATEWAY_URL=http://mcp-gateway:9000
      # ── Ollama on host VM (not containerised) ────────────────────────
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"  # resolves to Docker bridge → host VM
    depends_on:
      - mcp-gateway
      - loan-service
