openapi: 3.0.3
info:
  title: Appointment Scheduling Service API
  description: Microservice for booking appointments, managing provider schedules, and tracking appointment status.
  version: 1.0.0
servers:
  - url: http://localhost:8084
    description: Local Development Server
paths:
  /api/appointments:
    get:
      summary: List all appointments
      description: Retrieves all booked appointments across all patients and providers.
      operationId: listAppointments
      responses:
        '200':
          description: A list of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
    post:
      summary: Book an appointment
      description: Schedules a new appointment for a patient with a specific healthcare provider.
      operationId: bookAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentBookRequest'
      responses:
        '201':
          description: Appointment successfully booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          description: Invalid request or provider unavailable

  /api/appointments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier of the appointment
        schema:
          type: integer
          format: int64
    get:
      summary: Get appointment by ID
      description: Fetches details for a specific appointment.
      operationId: getAppointmentById
      responses:
        '200':
          description: Appointment details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment not found
    put:
      summary: Update appointment
      description: Updates appointment details such as date, time, or reason.
      operationId: updateAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdateRequest'
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment not found

  /api/appointments/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier of the appointment
        schema:
          type: integer
          format: int64
    put:
      summary: Cancel appointment
      description: Cancels a scheduled appointment.
      operationId: cancelAppointment
      responses:
        '200':
          description: Appointment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment not found

  /api/appointments/patient/{patientId}:
    parameters:
      - name: patientId
        in: path
        required: true
        description: ID of the patient
        schema:
          type: integer
          format: int64
    get:
      summary: Get appointments for a patient
      description: Retrieves all appointments for a specific patient.
      operationId: getAppointmentsByPatient
      responses:
        '200':
          description: List of patient appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'

  /api/appointments/provider/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        description: ID of the provider
        schema:
          type: integer
          format: int64
    get:
      summary: Get appointments for a provider
      description: Retrieves all scheduled appointments for a healthcare provider.
      operationId: getAppointmentsByProvider
      responses:
        '200':
          description: List of provider appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'

  /api/providers:
    get:
      summary: List all providers
      description: Retrieves a list of all healthcare providers and their specializations.
      operationId: listProviders
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
    post:
      summary: Create a new provider
      description: Registers a new healthcare provider in the system.
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreateRequest'
      responses:
        '201':
          description: Provider created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'

components:
  schemas:
    AppointmentStatus:
      type: string
      enum:
        - SCHEDULED
        - CONFIRMED
        - CANCELLED
        - COMPLETED
        - NO_SHOW

    Appointment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        patientId:
          type: integer
          format: int64
          example: 1
        providerId:
          type: integer
          format: int64
          example: 1
        appointmentDateTime:
          type: string
          format: date-time
          example: "2026-09-10T10:00:00Z"
        reason:
          type: string
          example: "Annual Cardiology Evaluation"
        status:
          $ref: '#/components/schemas/AppointmentStatus'

    AppointmentBookRequest:
      type: object
      required:
        - patientId
        - providerId
        - appointmentDateTime
        - reason
      properties:
        patientId:
          type: integer
          format: int64
        providerId:
          type: integer
          format: int64
        appointmentDateTime:
          type: string
          format: date-time
        reason:
          type: string

    AppointmentUpdateRequest:
      type: object
      properties:
        appointmentDateTime:
          type: string
          format: date-time
        reason:
          type: string
        status:
          $ref: '#/components/schemas/AppointmentStatus'

    Provider:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        firstName:
          type: string
          example: "Sarah"
        lastName:
          type: string
          example: "Johnson"
        specialization:
          type: string
          example: "Cardiology"
        email:
          type: string
          format: email
          example: "sarah.johnson@healthcare.com"
        phone:
          type: string
          example: "+1-555-0142"

    ProviderCreateRequest:
      type: object
      required:
        - firstName
        - lastName
        - specialization
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        specialization:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
