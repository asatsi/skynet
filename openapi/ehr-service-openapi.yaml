openapi: 3.0.3
info:
  title: EHR (Electronic Health Records) Service API
  description: Microservice for lab results, clinical diagnoses, treatment plans, and unified patient health summaries.
  version: 1.0.0
servers:
  - url: http://localhost:8083
    description: Local Development Server
paths:
  /api/ehr/lab-results:
    post:
      summary: Create a lab result
      description: Adds a new lab test result record for a patient.
      operationId: createLabResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabResultCreateRequest'
      responses:
        '201':
          description: Lab result created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabResult'

  /api/ehr/lab-results/patient/{patientId}:
    parameters:
      - name: patientId
        in: path
        required: true
        description: ID of the patient
        schema:
          type: integer
          format: int64
    get:
      summary: Get lab results for a patient
      description: Retrieves all lab test results for a specific patient.
      operationId: getLabResultsByPatient
      responses:
        '200':
          description: List of lab results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabResult'

  /api/ehr/diagnoses:
    post:
      summary: Create a diagnosis
      description: Records a medical diagnosis for a patient.
      operationId: createDiagnosis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosisCreateRequest'
      responses:
        '201':
          description: Diagnosis created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnosis'

  /api/ehr/diagnoses/patient/{patientId}:
    parameters:
      - name: patientId
        in: path
        required: true
        description: ID of the patient
        schema:
          type: integer
          format: int64
    get:
      summary: Get diagnoses for a patient
      description: Retrieves all medical diagnoses recorded for a specific patient.
      operationId: getDiagnosesByPatient
      responses:
        '200':
          description: List of diagnoses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Diagnosis'

  /api/ehr/treatment-plans:
    post:
      summary: Create a treatment plan
      description: Records a clinical treatment plan for a patient.
      operationId: createTreatmentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentPlanCreateRequest'
      responses:
        '201':
          description: Treatment plan created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentPlan'

  /api/ehr/treatment-plans/patient/{patientId}:
    parameters:
      - name: patientId
        in: path
        required: true
        description: ID of the patient
        schema:
          type: integer
          format: int64
    get:
      summary: Get treatment plans for a patient
      description: Retrieves all treatment plans prescribed for a specific patient.
      operationId: getTreatmentPlansByPatient
      responses:
        '200':
          description: List of treatment plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreatmentPlan'

  /api/ehr/patients/{patientId}/health-summary:
    parameters:
      - name: patientId
        in: path
        required: true
        description: ID of the patient
        schema:
          type: integer
          format: int64
    get:
      summary: Get complete health summary for a patient
      description: Compiles a unified health summary including lab results, diagnoses, and treatment plans for a patient.
      operationId: getHealthSummary
      responses:
        '200':
          description: Complete health summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSummary'

components:
  schemas:
    LabResult:
      type: object
      properties:
        id:
          type: integer
          format: int64
        patientId:
          type: integer
          format: int64
        testName:
          type: string
          example: "Comprehensive Metabolic Panel"
        testDate:
          type: string
          format: date
          example: "2026-08-15"
        resultValue:
          type: string
          example: "Normal (Glucose 95 mg/dL)"
        unit:
          type: string
          example: "mg/dL"
        referenceRange:
          type: string
          example: "70-99"

    LabResultCreateRequest:
      type: object
      required:
        - patientId
        - testName
        - testDate
        - resultValue
      properties:
        patientId:
          type: integer
          format: int64
        testName:
          type: string
        testDate:
          type: string
          format: date
        resultValue:
          type: string
        unit:
          type: string
        referenceRange:
          type: string

    Diagnosis:
      type: object
      properties:
        id:
          type: integer
          format: int64
        patientId:
          type: integer
          format: int64
        icdCode:
          type: string
          example: "I10"
        description:
          type: string
          example: "Essential (primary) hypertension"
        diagnosisDate:
          type: string
          format: date
        diagnosingDoctor:
          type: string
          example: "Dr. Robert Vance"

    DiagnosisCreateRequest:
      type: object
      required:
        - patientId
        - icdCode
        - description
        - diagnosisDate
        - diagnosingDoctor
      properties:
        patientId:
          type: integer
          format: int64
        icdCode:
          type: string
        description:
          type: string
        diagnosisDate:
          type: string
          format: date
        diagnosingDoctor:
          type: string

    TreatmentPlan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        patientId:
          type: integer
          format: int64
        title:
          type: string
          example: "Hypertension Management Plan"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        goals:
          type: string
          example: "Maintain BP below 120/80 mmHg"
        medications:
          type: string
          example: "Lisinopril 10mg daily"

    TreatmentPlanCreateRequest:
      type: object
      required:
        - patientId
        - title
        - startDate
        - goals
      properties:
        patientId:
          type: integer
          format: int64
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        goals:
          type: string
        medications:
          type: string

    HealthSummary:
      type: object
      properties:
        patientId:
          type: integer
          format: int64
        labResults:
          type: array
          items:
            $ref: '#/components/schemas/LabResult'
        diagnoses:
          type: array
          items:
            $ref: '#/components/schemas/Diagnosis'
        treatmentPlans:
          type: array
          items:
            $ref: '#/components/schemas/TreatmentPlan'
